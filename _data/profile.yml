intro: |
  I am a second year Ph.D. student in the Computer Science department at [Rice University](https://www.rice.edu), advised by [Dr. Yuke Wang](https://www.wang-yuke.com). Prior to this, I obtained bachelor's degrees in both science and engineering from [Tsinghua University](https://www.tsinghua.edu.cn/en/).

  Multi-agent systems drastically increase inference costs: agent steps, tool iterations, and multi-turn collaboration rapidly blow up KV-cache memory and latency. My research focuses on making these systems computationally viable — **DuoAttention** and **DiLoCo** on **MaxText** on the systems side, **AgentVerse** on the capability side.

research_question: "How to compute more with less resources?"


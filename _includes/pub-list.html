{% for pub in site.data.publications %}
<div class="pub-card{% if pub.abstract %} has-details{% endif %}">
  <div class="pub-inner-row">
    <div class="pub-thumb">
      <img src="{{ pub.image }}" alt="{{ pub.image_alt }}">
    </div>
    <div class="pub-body">
      <h3 class="pub-title">{{ pub.title }}</h3>
      <div class="pub-authors">{{ pub.authors }}</div>
      <div class="pub-venue">{{ pub.venue }}</div>
      <div class="pub-links">
        {% for link in pub.links %}
        <a href="{{ link.url }}" target="_blank" rel="noopener noreferrer">{{ link.label }}</a>
        {% endfor %}
      </div>
    </div>
  </div>
  {% if pub.abstract %}
  <div class="pub-abstract">
    <div class="pub-abstract-inner">{{ pub.abstract }}</div>
  </div>
  {% endif %}
</div>
{% endfor %}

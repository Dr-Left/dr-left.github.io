<script>
/* Hover reveals each card's detail panel via CSS. Where there is no real
   hover, we toggle the panel on tap instead (clicks on links still follow
   through). One handler covers every card type.

   The capability test must match the CSS media query exactly: gating on
   'ontouchstart' instead would attach handlers on hover-capable laptops
   that merely have a touchscreen, and skip them on pointer-less devices. */
(function () {
  if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

  var cards = [
    ['.pub-card.has-details', 'abstract-open'],
    ['.exp-entry.has-details', 'details-open'],
    ['.os-card.has-details', 'details-open'],
    ['.disclosure', 'details-open']
  ];

  cards.forEach(function (pair) {
    document.querySelectorAll(pair[0]).forEach(function (card) {
      card.addEventListener('click', function (e) {
        if (!e.target.closest('a')) this.classList.toggle(pair[1]);
      });
    });
  });
})();
</script>

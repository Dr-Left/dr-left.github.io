{% for edu in site.data.education %}
<div class="edu-entry">
  <img src="{{ edu.image }}" alt="{{ edu.name }} logo" class="edu-logo">
  <div class="edu-body">
    <h3 class="edu-name">{{ edu.name }}</h3>
    <div class="edu-date">{{ edu.date }}</div>
    {% for degree in edu.degrees %}
    <div class="edu-degree">{{ degree }}</div>
    {% endfor %}
  </div>
</div>
{% endfor %}
